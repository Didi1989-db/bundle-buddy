<!DOCTYPE html><html lang=it><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1.0"><title>Bundle Buddy</title><style>body{font-family:system-ui;max-width:420px;margin:0 auto;padding:16px;background:#f5f5f7}.phone{background:#fff;border-radius:24px;overflow:hidden;border:8px solid #000;box-shadow:0 10px 40px rgba(0,0,0,.2)}.h{background:#000;color:#fff;padding:16px;display:flex;justify-content:space-between}.b{margin:16px;background:#e6f9ec;border:2px solid #1DB954;padding:14px;border-radius:14px;text-align:center;font-weight:800;color:#0a7a2e}.c{padding:0 16px 20px}.item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.sav{background:#f8f8f8;border-radius:14px;padding:14px;margin-top:12px}.row{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}.row.g{color:#1DB954;font-weight:bold}.row.t{font-weight:800;font-size:16px;border-top:2px solid #000;margin-top:6px;padding-top:8px}.btn{width:100%;background:#1DB954;color:#fff;border:none;padding:15px;border-radius:14px;font-weight:800;font-size:16px;margin-top:14px}.add{border:2px dashed #ccc;border-radius:14px;padding:12px;margin:16px}.add input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:4px 0} .add button{width:100%;padding:10px;background:#000;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:4px}</style></head><body><div class=phone><div class=h><b>🛍️ bundle-buddy</b><span>di Didi</span></div><div class=b>🎉 Bundle! Risparmi 9,98€ - Una sola spedizione</div><div class=add><input id=n placeholder=Articolo><input id=v placeholder=Venditore><button onclick=a()>+ Aggiungi</button></div><div class=c><div id=L><div class=item>🎧 Wireless Headphones - TechGear Store - 59€</div><div class=item>⌚ Smart Watch - TechGear Store - 129€</div><div class=item>🔋 Power Bank - TechGear Store - 39€</div></div><div class=sav id=R><div class=row><span>Subtotale</span><span>227€</span></div><div class=row g><span>Risparmio bundle</span><span>-9,98€</span></div><div class=row t><span>Totale</span><span>231,99€</span></div></div><button class=btn>🛒 Aggiungi bundle al carrello</button></div></div></div><script>let C=[{n:'Headphones',v:'techgear'},{n:'Watch',v:'techgear'},{n:'Power',v:'techgear'}];function a(){let n=document.getElementById('n').value,v=document.getElementById('v').value.toLowerCase().trim();if(!n||!v)return alert('Scrivi tutto');C.push({n,v});let g={};C.forEach(x=>{g[x.v]=(g[x.v]||0)+1});let r=0;for(let k in g)if(g[k]>1)r+=(g[k]-1)*4.99;let h='';C.forEach(x=>h+=`<div class=item>📦 ${x.n} - ${x.v}</div>`);document.getElementById('L').innerHTML=h;document.getElementById('R').innerHTML=r>0?`<div class=row g>🎉 Bundle sbloccato! Risparmi ${r.toFixed(2)}€</div><div class=row t>Totale risparmiato ${r.toFixed(2)}€</div>`:'<div class=row>Aggiungi stesso venditore per risparmiare</div>';}</script></body></html>
